<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мои заказы — Не Парься</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('np-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="panel">
  <header class="p-header">
    <div class="p-header__inner">
      <a href="index.html" class="logo" id="homeLink">
        <span class="logo__mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="logo__text">Не Парься</span>
      </a>
      <div class="p-header__right">
        <button type="button" class="btn btn--ghost btn--sm" id="refresh">↻ Обновить</button>
      </div>
    </div>
  </header>

  <main class="p-wrap">
    <h1 class="p-title" id="hello">Мои заказы</h1>
    <p class="p-lead">Статус, оплата и готовые работы — всё здесь. Обновляется само.</p>
    <div id="content" aria-live="polite"><p class="p-muted"><span class="p-spin"></span> Загружаю заказы…</p></div>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <script src="sb.js"></script>
  <script src="cabinet.js"></script>
</body>
</html>
